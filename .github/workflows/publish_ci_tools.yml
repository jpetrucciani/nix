name: publish CI tools

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - scripts.nix
      - mods/ci-tools.nix
      - mods/final.nix
      - mods/hax.nix
      - mods/jfmt.nix
      - mods/override.nix
      - mods/pog/nix.nix
      - pkgs/cli/iets.nix
      - .github/styles/config/**
      - .github/scripts/tool-cache.sh
      - .github/workflows/publish_ci_tools.yml

permissions:
  contents: read

concurrency:
  group: publish-ci-tools
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jpetrucciani/actions/nix/setup@7235e5692c8aa8906e6c1827313a0a72d3b190e3
      - name: Publish signed closures and manifests
        run: |
          failed=0
          for tool in jfmt check-vale check-doc-links check-readme-index nupdate iets; do
            bash .github/scripts/tool-cache.sh publish "$tool" || failed=1
          done
          exit "$failed"
        env:
          POG_URI: ${{ secrets.POG_URI }}
          PRIVKEY: ${{ secrets.G7C_CACHE_PRIVATE_KEY }}
          S3_CREDS: ${{ secrets.S3_CREDS }}
          JFMT_ENDPOINT_URL: ${{ secrets.JFMT_ENDPOINT_URL }}
          JFMT_ACCESS_KEY_ID: ${{ secrets.JFMT_ACCESS_KEY_ID }}
          JFMT_SECRET_ACCESS_KEY: ${{ secrets.JFMT_SECRET_ACCESS_KEY }}
          JFMT_S3_BUCKET: ${{ vars.JFMT_S3_BUCKET }}
