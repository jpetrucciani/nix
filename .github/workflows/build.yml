name: build
on: { workflow_dispatch, push: { branches: [main] }, pull_request }

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: macos-15
            system: aarch64-darwin
    name: nix (${{ matrix.system }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://cache.g7c.us https://nix-community.cachix.org
            extra-trusted-public-keys = cache.g7c.us:dSWpE2B5zK/Fahd7npIQWM4izRnVL+a4LiCAnrjdoFY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Evaluate custom package derivations
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          attribute="lib.customPackageDrvPaths.$SYSTEM"
          if [[ $SYSTEM == x86_64-linux ]] && evaluator=$(bash .github/scripts/tool-cache.sh restore iets); then
            echo "Using cached iets for the package preflight"
            if IETS_NIX_FALLBACK=never "$evaluator" eval --json --timings --no-cache "git+file://$PWD#$attribute" >/dev/null; then
              exit 0
            fi
            echo "iets failed, retrying the package preflight with Nix"
          fi
          nix eval --json --no-write-lock-file ".#$attribute" >/dev/null
      - run: nix --show-trace build -L .#__j_custom
      - if: ${{ github.event_name != 'pull_request' }}
        env:
          CI_ARCHIVE_FLAKE: ${{ matrix.system == 'x86_64-linux' && 'true' || 'false' }}
          POG_URI: ${{ secrets.POG_URI }}
          PRIVKEY: ${{ secrets.G7C_CACHE_PRIVATE_KEY }}
          S3_CREDS: ${{ secrets.S3_CREDS }}
        run: nix run .#scripts.ci_cache
