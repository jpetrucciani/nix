set -g prefix C-a
set -g prefix2 C-b
bind -N "Send the prefix key through to the application" a send-prefix
bind C-a last-window

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-keys vi
setw -g mode-keys vi
set -g mouse on
set -g focus-events on
setw -g aggressive-resize off
setw -g clock-mode-style 12
# long enough that a loaded machine doesn't split mouse reports
set -s escape-time 50
set -g history-limit 100000

# Moving between windows.
unbind [
unbind ]
bind -r [ select-window -t :-
bind -r ] select-window -t :+

# Pane resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Maximize and restore a pane.
bind Up resize-pane -Z

# Copy mode ([ is taken above).
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Log output to a text file on demand.
bind P pipe-pane -o "cat >>~/#W.log" \; display "Toggled logging to ~/#W.log"

# -- display -------------------------------------------------------------------
# tabs
set -g window-status-current-format "#[fg=black]#[bg=red] #I #[bg=brightblack]#[fg=brightwhite] #W#[fg=brightblack]#[bg=black]"
set -g window-status-format "#[fg=black]#[bg=yellow] #I #[bg=brightblack]#[fg=brightwhite] #W#[fg=brightblack]#[bg=black]"

# status bar
set -g status-position bottom
set -g status-justify left
set -g status-fg colour1
set -g status-bg colour0
set -g status-left ' '
set -g status-right '%l:%M'
set -g set-titles on
# screen-256color, not tmux-256color: these scripts run on machines (macOS
# among them) whose terminfo doesn't have the tmux entry
set -g default-terminal "screen-256color"
# what an outer xterm-256color terminal can do: true color, OSC 8 links,
# OSC 52 clipboard, extended keys, synchronized output
set -as terminal-features ',xterm-256color:RGB:hyperlinks:clipboard:extkeys:sync'
# let escape sequences from the visible pane reach the outer terminal
set -g allow-passthrough on
set -g set-clipboard on
set -g extended-keys on
# Don't auto rename windows
set -g allow-rename off

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

setw -g monitor-activity on
set -g bell-action none
